[project]
name = "visual-search"
version = "0.1.0"
description = "Visual search POC with OpenCLIP embeddings and Qdrant"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "streamlit>=1.41",
    "streamlit-image-coordinates>=0.1.7",
    "numpy>=2.1",
    "pillow>=11.0",
    "tqdm>=4.67",
    "pyyaml>=6.0",
    "pydantic>=2.10",
    "hnswlib>=0.8",
    "torch>=2.5",
    "torchvision>=0.20",
    "open-clip-torch",
    "python-multipart",
    "qdrant-client>=1.12",
    "transformers>=4.40,<5",
    "opencv-python-headless>=4.13.0.92",
    "openpyxl>=3.1.5",
    "asammdf>=8.7.2",
    "ultralytics>=8.4.19",
    "sam-2",
    "peft>=0.18.1",
    "einops>=0.8.2",
]

[tool.uv]
dev-dependencies = []

[tool.uv.sources]
sam-2 = { git = "https://github.com/facebookresearch/sam2.git" }
transformers = { git = "https://github.com/huggingface/transformers.git" }
