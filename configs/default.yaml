data:
  image_dir: "data"
  sqlite_path: "artifacts/metadata/images.sqlite"
  allowed_ext: [".jpg", ".jpeg", ".png", ".webp"]

artifacts:
  root_dir: "artifacts"

model:
  model_version: "openclip_vitb32_v1"
  backbone: "ViT-B-32"
  pretrained: "laion2b_s34b_b79k"
  device: "auto" # "cpu", "cuda", or "auto"

preprocess:
  preprocess_version: "openclip_default_v1"

index:
  index_version: "hnsw_v1"
  space: "cosine"
  ef_construction: 200
  M: 32
  ef_search: 64
  top_k: 50
  top_k_candidates: 200
