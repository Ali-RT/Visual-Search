services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  search-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CONFIG_PATH: configs/adas_usecase.yaml
    volumes:
      - .:/app
    depends_on:
      - qdrant
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  qdrant_data:
